# Postgres + pgvector, for the "scale" path in the deck.
# The app runs on SQLite without this; see README.
services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: cfe
      POSTGRES_PASSWORD: cfe
      POSTGRES_DB: creator_fit_db
    ports: ['5432:5432']
    volumes:
      - cfe_pgdata:/var/lib/postgresql/data
      - ./backend/init-pgvector.sql:/docker-entrypoint-initdb.d/01-pgvector.sql:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U cfe -d creator_fit_db']
      interval: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports: ['6379:6379']

volumes:
  cfe_pgdata:
